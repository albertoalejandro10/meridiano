services:
  postgres:
    image: postgres:18-alpine
    container_name: beto-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beto_tracker
      POSTGRES_PASSWORD: beto_tracker_password
      POSTGRES_DB: beto_tracker
    ports:
      # Host port 5433 to avoid clashing with other local Postgres containers
      - "5433:5432"
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beto_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production-style app container. Not needed for day-to-day dev (use `pnpm dev`).
  # Start with: docker compose --profile app up --build
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: beto-tracker:latest
    container_name: beto-tracker
    profiles: [app]
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
